services:
  postgres:
    image: postgres:17-bookworm
    container_name: picadito-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - picadito-data:/var/lib/postgresql/data

volumes:
  picadito-data:
